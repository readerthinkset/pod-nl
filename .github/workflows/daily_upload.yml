name: Velocity Dutch Podcast - Daily Upload

on:
  schedule:
    - cron: '10 5 * * *'
  workflow_dispatch:
    inputs:
      upload_youtube:
        description: 'Upload to YouTube? (auto = alternate days, true = force upload, false = skip)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-color-emoji
          sudo fc-cache -fv
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'openai' }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          python -c "import os; keys=['POLLINATIONS_API_KEY','AI_MODEL','YT_CLIENT_ID','YT_CLIENT_SECRET','YT_REFRESH_TOKEN','FACEBOOK_ACCESS_TOKEN','FACEBOOK_PAGE_ID']; open('.env','w',encoding='utf-8').write('\n'.join(f'{k}={os.getenv(k, "")}' for k in keys))"

      - name: Generate podcast
        id: generate
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'openai' }}
        run: python podcast_generator.py

      # Facebook publishes every day and runs BEFORE YouTube so a YouTube
      # failure or missing YouTube credentials can never block it.
      - name: 📘 Upload to Facebook Page
        if: steps.generate.outcome == 'success'
        continue-on-error: true
        env:
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          if [ -z "$FACEBOOK_ACCESS_TOKEN" ] || [ -z "$FACEBOOK_PAGE_ID" ]; then
            echo "::warning::Facebook credentials missing - skipping Facebook upload."
          elif [ -f "upload_to_facebook.py" ]; then
            python upload_to_facebook.py
          fi

      - name: 📅 Check YouTube upload schedule (Alternate days)
        id: yt_schedule
        if: steps.generate.outcome == 'success'
        run: |
          INPUT_CHOICE="${{ github.event.inputs.upload_youtube }}"
          if [ "$INPUT_CHOICE" = "true" ]; then
            echo "should_upload=true" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to TRUE."
          elif [ "$INPUT_CHOICE" = "false" ]; then
            echo "should_upload=false" >> "$GITHUB_OUTPUT"
            echo "Manual override: YouTube upload forced to FALSE."
          else
            DAY_OF_YEAR=$(date -u +%-j)
            echo "Current UTC Day of Year: $DAY_OF_YEAR"
            if [ $(( 10#$DAY_OF_YEAR % 2 )) -ne 0 ]; then
              echo "should_upload=true" >> "$GITHUB_OUTPUT"
              echo "Today is a scheduled YouTube upload day (Day $DAY_OF_YEAR)."
            else
              echo "should_upload=false" >> "$GITHUB_OUTPUT"
              echo "Today is an alternate off-day for YouTube (Day $DAY_OF_YEAR). Facebook has already published."
            fi
          fi

      - name: 🔑 Check YouTube credentials
        id: yt_creds
        if: steps.generate.outcome == 'success'
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -n "$YT_CLIENT_ID" ] && [ -n "$YT_CLIENT_SECRET" ] && [ -n "$YT_REFRESH_TOKEN" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning::YouTube credentials missing for this repo - skipping YouTube (Facebook already published)."
          fi

      - name: Upload to YouTube
        if: steps.yt_schedule.outputs.should_upload == 'true' && steps.yt_creds.outputs.has_creds == 'true'
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          export PYTHONPATH="${{ github.workspace }}:$PYTHONPATH"
          python upload_to_youtube.py
          python set_channel_description.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podcast-video-${{ github.run_number }}
          path: |
            output/podcast_*/podcast_final.mp4
            output/podcast_*/thumbnail.jpg
            output/podcast_*/facebook_upload_result.json
            output/latest_upload_info.json
          retention-days: 7
